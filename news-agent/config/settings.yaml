agent:
  polling_interval_minutes: 15
  batch_size_per_source: 15 # Maximum articles fetched per feed/site per cycle
  max_article_age_minutes: 15 # Maximum age of articles in minutes (e.g. 15 = only fetch/process news from the past 15 min; set null/0 to disable)
  database_path: "data/agent.db"
  enable_etag_cache: true # Enable HTTP conditional GET (ETag/Last-Modified) feed caching
  extract_full_body: true # Fetch full article text for deep analysis and comprehension instead of RSS snippet only
  fetch_max_retries: 3 # Retry count on feed network/connection drop or HTTP 5xx
  fetch_retry_backoff: 1.0 # Backoff factor in seconds for feed fetch retries

filter:
  min_confidence_score: 6
  min_impact_grade: "HIGH" # Options: LOW, AVERAGE (or MEDIUM), HIGH, CRITICAL
  alert_on_all: false
  enable_fact_verification: false # Fact-verification gate toggle (currently disabled per request)
  enable_batch_triage: true # Pre-screen headlines with low-token batch triage to optimize API calls
  buy_opportunities_only: true # Only alert on actionable buy opportunities (suppress avoid/short/hedge-only alerts)

llm:
  model: "gemini/gemini-3.8-flash"
  fallback_model: "gemini/gemini-flash-lite-latest" # Primary fallback model on rate limit or failure
  fallback_models:
    - "gemini/gemini-flash-lite-latest"
    - "gemini/gemini-3.5-flash-lite"
    - "gemini/gemini-3.6-flash"
    - "gemini/gemini-3.1-flash-lite"
    - "gemini/gemini-3.7-flash"
    - "gpt-4o-mini"
  timeout: 15.0 # Per-request timeout in seconds (prevents hanging on overloaded models)
  enable_cache: true # Enable LiteLLM response caching
  max_content_length: 3500 # Max characters of article body passed to LLM (prevents prompt token bloat)
  monthly_budget_usd: 10.0 # Monthly LLM spending cap in USD
  temperature: 0.1
  max_retries: 3
  backoff_delay: 2.0 # Initial backoff delay in seconds on 429
  backoff_factor: 2.0 # Exponential backoff multiplier

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  batch_notifications: true # Combine multiple recommendations from the same polling cycle into 1 push

watchlist:
  enabled: true
  tickers: ["$NVDA", "$TSLA", "$AAPL"]
  sectors: ["Semiconductors", "Defense & Aerospace", "Commercial Airlines"]
  score_boost: 1

